name: Build verified release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: npm ci
      - name: Prepare matching native GEOS and baseline
        run: npm run setup:geos -- --skip-npm
      - name: Prepare independent QGIS reference
        run: bash validation/qgis/setup-env.sh
      - name: Install real browser
        run: npx playwright install --with-deps chromium
      - name: Rebuild with the pinned SDK and collect corresponding source
        run: npm run release:engine
      - name: Run all checks against the rebuilt engine and seal the candidate
        run: npm run release:check
      - name: Recheck final files and validation evidence
        run: npm run release:verify
      - name: Archive the verified site with all source parts
        run: tar -czf geolint-release.tar.gz -C dist .
      - name: Preserve complete verified distribution
        uses: actions/upload-artifact@v4
        with:
          name: geolint-verified-release
          path: |
            geolint-release.tar.gz
            .cache/release-engine/manifest.json
            .cache/release-engine/validation.json
            .cache/release-engine/checks/
          include-hidden-files: true
          compression-level: 0
          retention-days: 30
      - name: Preserve failed-check logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: geolint-release-failure-logs
          path: .cache/release-engine/checks/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
